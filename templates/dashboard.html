<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social IA Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2d;
      --panel-2: #17233d;
      --line: #24314e;
      --text: #edf2ff;
      --muted: #8ea0c6;
      --green: #22c55e;
      --green-soft: rgba(34,197,94,0.15);
      --purple: #8b5cf6;
      --purple-soft: rgba(139,92,246,0.15);
      --blue: #3b82f6;
      --red: #ef4444;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #0b1020 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 260px 1fr 320px;
      min-height: 100vh;
    }

    .sidebar, .right-panel {
      background: rgba(18, 26, 45, 0.96);
      border-right: 1px solid var(--line);
    }

    .right-panel {
      border-right: none;
      border-left: 1px solid var(--line);
    }

    .sidebar-inner, .right-inner {
      padding: 22px 18px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      font-size: 1.15rem;
      color: var(--green);
    }

    .brand-badge {
      background: var(--green-soft);
      border: 1px solid rgba(34,197,94,0.4);
      padding: 5px 8px;
      border-radius: 999px;
      color: var(--green);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 0.94rem;
    }

    .nav-item.active,
    .nav-item:hover {
      background: rgba(255,255,255,0.03);
      border-color: var(--line);
    }

    .content {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: rgba(18,26,45,0.9);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .topbar h2 {
      margin: 0;
      font-size: 1.35rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .story-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 16px;
    }

    .story-card {
      background: linear-gradient(135deg, var(--purple-soft), rgba(16,185,129,0.08));
      border: 1px solid var(--line);
      border-radius: 18px;
      min-height: 145px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
    }

    .story-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 50%);
    }

    .story-card > * { position: relative; z-index: 1; }

    .story-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.4);
      font-weight: 700;
      margin-bottom: auto;
    }

    .composer {
      background: rgba(18,26,45,0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .composer-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--purple));
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .composer textarea {
      flex: 1;
      min-height: 90px;
      background: rgba(11,16,32,0.8);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      resize: vertical;
    }

    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .tiny-actions {
      display: flex;
      gap: 10px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .primary {
      background: linear-gradient(135deg, var(--green), #34d399);
      color: #08130d;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post {
      background: rgba(18,26,45,0.9);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .post-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-line {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mini-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .meta { color: var(--muted); font-size: 0.78rem; }

    .post-body {
      color: var(--text);
      line-height: 1.6;
      font-size: 0.96rem;
    }

    .post-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-chip {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      padding: 7px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .right-panel .panel-card {
      background: rgba(18,26,45,0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .right-panel h4 {
      margin: 0 0 12px;
      font-size: 0.9rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .list-item:last-child { border-bottom: none; }

    .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(34,197,94,0.8);
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 12px;
    }

    .chat-message {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      font-size: 0.9rem;
    }

    .chat-input {
      width: 100%;
      margin-top: 12px;
      background: rgba(11,16,32,0.8);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 80px;
      resize: vertical;
    }

    @media (max-width: 1100px) {
      .app-shell {
        grid-template-columns: 220px 1fr;
      }
      .right-panel { display: none; }
    }

    @media (max-width: 760px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
      .story-row { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
      .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="brand">
          <strong>Social IA</strong>
          <span class="brand-badge">LIVE</span>
        </div>

        <div class="nav-group">
          <button class="nav-item active">🏠 Inicio</button>
          <button class="nav-item">🔎 Explorar</button>
          <button class="nav-item">📷 Stories</button>
          <button class="nav-item">🎬 Reels</button>
          <button class="nav-item">💬 Mensajes</button>
          <button class="nav-item">📢 Canales</button>
          <button class="nav-item">⚙️ Configuración</button>
          <button class="nav-item" onclick="window.location.href='/logout'">🚪 Cerrar sesión</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="topbar">
        <h2>Feed principal</h2>
        <div class="top-actions">
          <button class="pill" id="refreshFeedBtn">Actualizar</button>
          <button class="pill" id="openAiBtn">IA + contenido</button>
        </div>
      </div>

      <section class="story-row">
        <div class="story-card">
          <div class="story-avatar">A</div>
          <div><strong>Tu historia</strong></div>
        </div>
        <div class="story-card">
          <div class="story-avatar">M</div>
          <div><strong>Marketing</strong></div>
        </div>
        <div class="story-card">
          <div class="story-avatar">N</div>
          <div><strong>Negocios</strong></div>
        </div>
        <div class="story-card">
          <div class="story-avatar">C</div>
          <div><strong>Comunidad</strong></div>
        </div>
      </section>

      <section class="composer">
        <div class="composer-row">
          <div class="avatar">U</div>
          <textarea id="postText" placeholder="¿Qué estás pensando hoy?"></textarea>
        </div>
        <div class="composer-actions">
          <div class="tiny-actions">
            <span>📷 Foto</span>
            <span>🎥 Video</span>
            <span>🙂 Sentimiento</span>
          </div>
          <button class="primary" id="publishBtn">Publicar</button>
        </div>
      </section>

      <section id="feed" class="feed"></section>
    </main>

    <aside class="right-panel">
      <div class="right-inner">
        <div class="panel-card">
          <h4>Recomendados</h4>
          <div class="list">
            <div class="list-item">
              <div class="user-line">
                <div class="mini-avatar">S</div>
                <div>
                  <strong>Soluciones IA</strong><br>
                  <span class="meta">@solucionesai</span>
                </div>
              </div>
              <span class="online-dot"></span>
            </div>
            <div class="list-item">
              <div class="user-line">
                <div class="mini-avatar">B</div>
                <div>
                  <strong>Brand Lab</strong><br>
                  <span class="meta">@brandlab</span>
                </div>
              </div>
              <span class="online-dot"></span>
            </div>
          </div>
        </div>

        <div class="panel-card">
          <h4>Chat</h4>
          <div id="chatBox" class="chat-box">
            <div class="chat-message">Hola, ¿cómo va tu estrategia de contenido?</div>
            <div class="chat-message">Puedes probar un tema de crecimiento con IA.</div>
          </div>
          <textarea id="chatInput" class="chat-input" placeholder="Escribe un mensaje..."></textarea>
          <div style="margin-top:12px; display:flex; justify-content:flex-end;">
            <button class="primary" id="sendChatBtn">Enviar</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    async function loadFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '<div class="post"><div class="post-body">Cargando publicaciones...</div></div>';

      try {
        const response = await fetch('/api/feed');
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || 'No se pudo cargar el feed.');
        }

        if (!data.posts || data.posts.length === 0) {
          feed.innerHTML = '<div class="post"><div class="post-body">Aún no hay publicaciones. ¡Sé el primero en compartir algo!</div></div>';
          return;
        }

        feed.innerHTML = data.posts.map(post => `
          <article class="post">
            <div class="post-head">
              <div class="user-line">
                <div class="mini-avatar">${(post.author || 'U').charAt(0).toUpperCase()}</div>
                <div>
                  <strong>${post.author || 'Usuario'}</strong><br>
                  <span class="meta">${post.created_at || 'ahora'}</span>
                </div>
              </div>
              <span class="pill">${post.is_bot ? 'Bot IA' : 'Publicación'}</span>
            </div>
            <div class="post-body">${(post.content || 'Sin contenido').replace(/\n/g, '<br>')}</div>
            <div class="post-actions">
              <button class="action-chip" type="button">💜 Me gusta</button>
              <button class="action-chip" type="button">💬 Comentar</button>
              <button class="action-chip" type="button">↗ Compartir</button>
            </div>
          </article>
        `).join('');
      } catch (error) {
        feed.innerHTML = '<div class="post"><div class="post-body">Error al cargar el feed: ' + error.message + '</div></div>';
      }
    }

    async function publishPost() {
      const text = document.getElementById('postText').value.trim();
      if (!text) {
        alert('Escribe algo para publicar.');
        return;
      }

      try {
        const response = await fetch('/api/posts/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: text })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || 'No se pudo publicar.');
        }

        document.getElementById('postText').value = '';
        await loadFeed();
      } catch (error) {
        alert(error.message || 'No se pudo publicar.');
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const box = document.getElementById('chatBox');
      const text = input.value.trim();
      if (!text) return;

      const msg = document.createElement('div');
      msg.className = 'chat-message';
      msg.textContent = 'Tú: ' + text;
      box.appendChild(msg);
      input.value = '';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ toolName: 'Chat Social', prompt: text })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || 'No se pudo responder.');
        }

        const ai = document.createElement('div');
        ai.className = 'chat-message';
        ai.textContent = 'IA: ' + (data.response || data.reply || 'Sin respuesta.');
        box.appendChild(ai);
      } catch (error) {
        const ai = document.createElement('div');
        ai.className = 'chat-message';
        ai.textContent = 'IA: ' + error.message;
        box.appendChild(ai);
      }

      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('publishBtn').addEventListener('click', publishPost);
    document.getElementById('refreshFeedBtn').addEventListener('click', loadFeed);
    document.getElementById('sendChatBtn').addEventListener('click', sendChatMessage);
    document.getElementById('openAiBtn').addEventListener('click', () => {
      alert('La IA está activa para generar contenido e ideas desde el chat y el dashboard.');
    });

    loadFeed();
  </script>
</body>
</html>
