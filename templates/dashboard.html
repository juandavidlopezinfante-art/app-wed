<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business IA - Inicio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #10b981; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .btn-google {
            background-color: #ffffff;
            color: #334155;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            display: block;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-incognito {
            background-color: #334155;
            color: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Digital Business IA</h1>
        <p>Inicia sesión para continuar</p>
        
        <!-- Botón de Google Auth -->
        <a href="/login" class="btn-google">Iniciar sesión con Google</a>
        
        <!-- Acceso en Modo Incognito -->
        <a href="/dashboard" class="btn-incognito">Entrar en Modo Incógnito</a>
    </div>
</body>
</html>
