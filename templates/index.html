<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<<<<<<< HEAD
    <title>Generador de Imágenes con IA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 600px;
            width: 100%;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background-color: #4338ca;
        }
        #loading {
            display: none;
            margin-top: 20px;
            color: #555;
            font-style: italic;
        }
        .resultado {
            margin-top: 25px;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }
        .btn-descargar {
            display: inline-block;
            padding: 10px 20px;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-descargar:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Generador de Imágenes con IA</h2>
        <form action="/generar" method="POST" onsubmit="mostrarCarga()">
            <input type="text" name="prompt" placeholder="Ej. Un astronauta paseando en bicicleta" required>
            <button type="submit">Generar</button>
        </form>

        <div id="loading">🎨 La inteligencia artificial está creando tu imagen, por favor espera unos segundos...</div>

        {% if imagen_url %}
        <div class="resultado">
            <h3>¡Imagen creada con éxito!</h3>
            <img src="{{ url_for('static', filename=imagen_url) }}" alt="Imagen generada por IA"><br>
            <a href="{{ url_for('static', filename=imagen_url) }}" class="btn-descargar" download>Descargar Imagen</a>
        </div>
        {% endif %}
    </div>

    <script>
        function mostrarCarga() {
            document.getElementById('loading').style.display = 'block';
        }
    </script>

</body>
</html>
