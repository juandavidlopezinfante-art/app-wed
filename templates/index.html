<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Digital Business IA - Iniciar Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        h2 { margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .btn-google {
            background-color: #ffffff;
            color: #1e293b;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .btn-google:hover { background-color: #f1f5f9; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Digital Business IA</h2>
        <p>Inicia sesión con tu cuenta para acceder a la suite</p>
        
        <!-- Botón de Acceso con Google -->
        <button id="google-login-btn" class="btn-google">
            Continuar con Google
        </button>
    </div>

    <!-- Script de autenticación mediante Firebase CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCy058MvYn1E2QjLS09uUlvMetf2UMP2JE",
            authDomain: "digital-business-ia.firebaseapp.com",
            projectId: "digital-business-ia",
            storageBucket: "digital-business-ia.firebasestorage.app",
            messagingSenderId: "221344612488",
            appId: "1:221344612488:web:0f4dd98c920cd1739e5f3d",
            measurementId: "G-PKKYEGSHGP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        document.getElementById('google-login-btn').addEventListener('click', () => {
            signInWithPopup(auth, googleProvider)
            .then((result) => {
                window.location.href = "/dashboard";
            })
            .catch((error) => {
                console.error("Error en el inicio de sesión:", error);
            });
        });
    </script>
</body>
</html>
