<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Genera una imagen con IA</title>
</head>
<body>
    <h2>Genera una imagen con IA</h2>
    
    <form method="POST">
        <input type="text" name="prompt" placeholder="Escribe lo que quieres generar..." required>
        <button type="submit">Generar</button>
    </form>

    {% if imagen_url %}
        <div style="margin-top: 20px;">
            <img src="{{ imagen_url }}" alt="Imagen generada" style="max-width: 100%; border-radius: 8px;">
        </div>
    {% endif %}
</body>
</html>
